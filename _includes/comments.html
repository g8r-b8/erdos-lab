<section class="comments">
  <h2>Comments &amp; corrections</h2>
  <script src="https://giscus.app/client.js"
    data-repo="{{ site.giscus.repo }}"
    data-repo-id="{{ site.giscus.repo_id }}"
    data-category="{{ site.giscus.category }}"
    data-category-id="{{ site.giscus.category_id }}"
    data-mapping="pathname" data-strict="1" data-reactions-enabled="1"
    data-emit-metadata="0" data-input-position="top"
    data-theme="preferred_color_scheme" data-lang="en" data-loading="lazy"
    crossorigin="anonymous" async></script>
  <noscript>Comments are GitHub Discussions on <a href="https://github.com/{{ site.giscus.repo }}/discussions">{{ site.giscus.repo }}</a>.</noscript>
</section>
